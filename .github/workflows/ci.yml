name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` so the package's own `prepare` build cannot run
      # before the contract check has had a say.
      - run: npm ci --ignore-scripts

      - name: Enforce the injection contract
        run: npm run contract

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `dist/` is committed so a consumer installs this package with no
      # install script of any kind. That only works while the committed build
      # matches the source, so drift is a build failure here rather than a
      # confusing bug in a consumer.
      - name: Committed dist must match a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo '::error::dist/ is stale. Run `npm run build` and commit dist/.'
            git diff --stat -- dist
            exit 1
          fi

      - name: Test
        run: npm run test

      # A consumer installs this package from a git tag and npm runs `prepare`
      # (the build) at install time. Prove that path works before tagging,
      # because a broken `prepare` breaks every consumer's build, not this one.
      - name: Prove the package installs and resolves as a real consumer
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/ishan-ecosystem-core-*.tgz
          node --input-type=module -e "
            const root = await import('@ishan/ecosystem-core');
            // Every published subpath, so a release cannot remove or break one
            // that only a consumer imports. `./auth` and `./tokens` are bound
            // by the identity sidecar and the storefront, and `./payments` was
            // changed by the 0.5.0 release, so all three are load-bearing.
            for (const sub of ['auth', 'email', 'subscribers', 'data', 'http', 'cache', 'tokens', 'payments', 'monitoring']) {
              await import('@ishan/ecosystem-core/' + sub);
            }
            for (const name of ['createEmailService', 'createPostgrest', 'createSupabaseSubscriberTable', 'InMemoryRateLimiter']) {
              if (typeof root[name] !== 'function') throw new Error('missing export: ' + name);
            }
            // `auth` is the subpath the identity sidecar and the storefront
            // bind against, so a release that broke it would only surface at
            // their install, not here. Prove the symbols it imports.
            const auth = await import('@ishan/ecosystem-core/auth');
            for (const name of ['createSessionService', 'resolveRole', 'hasPremiumAccess', 'hasPermission']) {
              if (typeof auth[name] !== 'function') throw new Error('auth subpath missing export: ' + name);
            }
            // 0.5.0 changed tokens and extracted payments; both must resolve as
            // real modules with their entry points present.
            const tokens = await import('@ishan/ecosystem-core/tokens');
            if (typeof tokens.mintToken !== 'function' || typeof tokens.verifyToken !== 'function')
              throw new Error('tokens subpath missing mintToken/verifyToken');
            const payments = await import('@ishan/ecosystem-core/payments');
            if (typeof payments.createRazorpayClient !== 'function')
              throw new Error('payments subpath missing createRazorpayClient');
            console.log('consumer resolution: OK');
          "

  # The steps above prove the package is buildable. This proves the thing
  # consumers actually receive: the published tag, installed over plain HTTPS
  # with no credentials, typechecked by a strict project that knows nothing
  # about this repository. It runs only on a tag, because that is the only time
  # the artifact it tests exists.
  published-artifact:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install the published tag from scratch and typecheck it
        run: |
          cd consumer-smoke
          npm install --no-audit --no-fund \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          ../node_modules/.bin/tsc -p tsconfig.json
          echo 'published artifact resolves and typechecks for a fresh consumer'
