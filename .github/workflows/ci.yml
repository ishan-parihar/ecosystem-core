name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the semver gate compares against the previous release,
      # so it needs real history. The default depth-1 checkout has no HEAD^
      # and no tag, and the gate then fails with "invalid object name".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` so the package's own `prepare` build cannot run
      # before the contract check has had a say.
      - run: npm ci --ignore-scripts

      - name: Enforce the injection contract
        run: npm run contract

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `dist/` is committed so a consumer installs this package with no
      # install script of any kind. That only works while the committed build
      # matches the source, so drift is a build failure here rather than a
      # confusing bug in a consumer.
      - name: Committed dist must match a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo '::error::dist/ is stale. Run `npm run build` and commit dist/.'
            git diff --stat -- dist
            exit 1
          fi

      # A removal or a rename of a published subpath or root export is a legal
      # edit to package.json, so nothing else objects to it. 0.5.0 removed
      # ./campaign and ./security and the tag shipped; a consumer importing
      # either found out at their own upgrade. This makes the version number an
      # enforced claim. Fault-injected before wiring: it fails on a removed
      # subpath, a renamed root export, and a changed subpath target, and
      # passes on a clean tree, an additive subpath, and a removal paired with
      # the bump that declares it.
      - name: Breaking surface change requires a version bump
        run: npm run check:semver

      - name: Test
        run: npm run test

      # A consumer installs this package from a git tag and npm runs `prepare`
      # (the build) at install time. Prove that path works before tagging,
      # because a broken `prepare` breaks every consumer's build, not this one.
      - name: Prove the package installs and resolves as a real consumer
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/ishan-ecosystem-core-*.tgz
          node --input-type=module -e "
            const root = await import('@ishan/ecosystem-core');
            // Every published subpath, so a release cannot remove or break one
            // that only a consumer imports. `./auth` and `./tokens` are bound by
            // the identity sidecar and the storefront, and `./tokens` and
            // `./payments` are the two modules 0.5.0 changed, so they are
            // load-bearing rather than incidental.
            //
            // Each entry is the VERIFIED runtime value export of that subpath,
            // enumerated from the built dist rather than from the .d.ts
            // (index.d.ts re-exports, so the functions live in sub-files and a
            // reader who checks only the entry declaration will conclude they
            // are missing). Type-only exports are erased at runtime and cannot
            // be asserted here; the typecheck job is their gate.
            const EXPECTED = {
              auth:        ['createSessionService', 'hasPermission', 'hasPremiumAccess', 'isAdmin', 'resolveRole'],
              email:       ['createEmailService', 'createMockProvider', 'renderEmailShell', 'sanitizeHeaderValue'],
              subscribers: ['createSupabaseSubscriberTable', 'mintToken', 'verifyToken'],
              data:        ['createPostgrest', 'PostgrestClient', 'filterValue', 'likePattern'],
              http:        ['InMemoryRateLimiter', 'FixedWindowRateLimiter', 'verifyTurnstile', 'resolvePolicy'],
              cache:       ['getOrSet', 'resolveCache', 'MemoryCache', 'KvCache'],
              tokens:      ['mintToken', 'verifyToken', 'verifyTokenCompat'],
              payments:    ['createRazorpayClient', 'RazorpayApiError'],
              monitoring:  ['shouldPauseSending', 'summarizeDelivery', 'summarizeByLane'],
            };
            for (const [sub, names] of Object.entries(EXPECTED)) {
              const m = await import('@ishan/ecosystem-core/' + sub);
              const missing = names.filter((n) => typeof m[n] !== 'function');
              if (missing.length) {
                throw new Error('@ishan/ecosystem-core/' + sub + ' missing value export(s): ' + missing.join(', '));
              }
            }
            for (const name of ['createEmailService', 'createPostgrest', 'createSupabaseSubscriberTable', 'InMemoryRateLimiter']) {
              if (typeof root[name] !== 'function') throw new Error('missing export: ' + name);
            }
            console.log('consumer resolution: OK (' + Object.keys(EXPECTED).length + ' subpaths, ' +
              Object.values(EXPECTED).flat().length + ' value exports)');
          "

  # The steps above prove the package is buildable. This proves the thing
  # consumers actually receive: the published tag, installed over plain HTTPS
  # with no credentials, typechecked by a strict project that knows nothing
  # about this repository. It runs only on a tag, because that is the only time
  # the artifact it tests exists.
  published-artifact:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the semver gate compares against the previous release,
      # so it needs real history. The default depth-1 checkout has no HEAD^
      # and no tag, and the gate then fails with "invalid object name".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install the published tag from scratch and typecheck it
        run: |
          cd consumer-smoke
          npm install --no-audit --no-fund \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          ../node_modules/.bin/tsc -p tsconfig.json
          echo 'published artifact resolves and typechecks for a fresh consumer'
